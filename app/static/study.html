<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TechCards SRS — Estudio local</title>
  <style>
    :root { color-scheme: light; background: #fff; color: #000; font-family: system-ui, Ubuntu, sans-serif; line-height: 1.5; }
    body { max-width: 48rem; margin: 1.5rem auto; padding: 0 1rem 3rem; }
    header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid #dfdfdf; padding-bottom: 0.5rem; }
    h1, h2 { margin: 0; font-size: 1.05rem; }
    h1 { font-size: 1.35rem; }
    section, details { margin-top: 1.1rem; padding: 0.9rem; border: 1px solid #dfdfdf; border-radius: 6px; }
    summary { cursor: pointer; font-weight: 700; }
    .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
    .field { display: flex; flex-direction: column; gap: 0.25rem; margin-top: 0.5rem; }
    input, select, textarea, button { font: inherit; padding: 0.35rem 0.6rem; border-radius: 4px; border: 1px solid #cfcfcf; }
    textarea { width: 100%; box-sizing: border-box; min-height: 3rem; }
    a { color: #0000ee; }
    select, input { max-width: 100%; box-sizing: border-box; }
    button { background: #f2f2f2; cursor: pointer; }
    :disabled { opacity: 0.55; cursor: not-allowed; }
    .box { white-space: pre-wrap; overflow-wrap: anywhere; padding: 0.7rem; border-radius: 4px; background: #f7f7f7; margin: 0.5rem 0; }
    .meta { font-size: 0.85rem; opacity: 0.8; }
    .status { margin: 0.5rem 0 0; font-size: 0.9rem; }
    .status.error { color: #c62828; }
    .status.ok { color: #2e7d32; }
    .item { border-top: 1px solid #dfdfdf; padding-top: 0.7rem; margin-top: 0.7rem; overflow-wrap: anywhere; }
    :focus-visible { outline: 3px solid #195a9a; outline-offset: 2px; }
    header { gap: 1rem; }
    @media (max-width: 34rem) {
      #deck-heading + .row { display: grid; align-items: stretch; }
      #deck-id, #deck-select { width: 100%; min-width: 0; }
      #grade-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      button, input, select { min-height: 44px; }
    }
  </style>
</head>
<body>
  <header>
    <div><h1>TechCards SRS</h1><span class="meta">Repaso local</span></div>
    <a href="/docs">Documentación de la API</a>
  </header>

  <main>
    <section aria-labelledby="deck-heading">
      <h2 id="deck-heading">Mazo</h2>
      <div class="row">
        <label for="deck-select">Mazo</label>
        <select id="deck-select" aria-label="Seleccionar mazo"><option value="">Elige un mazo</option></select>
        <label for="deck-id">ID del mazo</label>
        <input id="deck-id" type="text" inputmode="numeric" pattern="[1-9][0-9]*" placeholder="ID del mazo" size="19">
        <button id="load-next-btn" type="button">Cargar siguiente tarjeta</button>
        <button id="refresh-decks-btn" type="button">Actualizar mazos</button>
      </div>
      <p id="study-status" class="status" role="status" aria-live="polite"></p>
    </section>

    <section id="study-card" hidden aria-labelledby="card-heading">
      <h2 id="card-heading" tabindex="-1">Tarjeta actual</h2>
      <p id="card-meta" class="meta"></p>
      <div id="card-front" class="box"></div>
      <div class="row"><button id="reveal-btn" aria-keyshortcuts="R" type="button">Mostrar respuesta</button></div>

      <div id="answer-panel" hidden>
        <strong class="meta">Respuesta</strong>
        <div id="card-back" class="box" tabindex="-1" role="group" aria-label="Respuesta"></div>
        <div id="accepted-wrap" hidden><strong class="meta">Respuestas aceptadas</strong><ul id="card-accepted"></ul></div>
        <div id="explanation-wrap" hidden><strong class="meta">Explicación</strong><p id="card-explanation" class="box"></p></div>
      </div>

      <p class="meta">Con el foco en la tarjeta, pulsa R para mostrar la respuesta y del 0 al 5 para calificar.</p>
      <div id="grade-controls" class="row" role="group" aria-label="Califica tu recuerdo del 0 al 5">
        <button type="button" data-quality="0" aria-keyshortcuts="0" aria-label="0: No recordé nada">0 · En blanco</button>
        <button type="button" data-quality="1" aria-keyshortcuts="1" aria-label="1: Respuesta incorrecta">1 · Incorrecta</button>
        <button type="button" data-quality="2" aria-keyshortcuts="2" aria-label="2: Incorrecta, pero me resultó familiar">2 · Familiar</button>
        <button type="button" data-quality="3" aria-keyshortcuts="3" aria-label="3: Correcta con dificultad">3 · Difícil</button>
        <button type="button" data-quality="4" aria-keyshortcuts="4" aria-label="4: Correcta con alguna duda">4 · Bien</button>
        <button type="button" data-quality="5" aria-keyshortcuts="5" aria-label="5: Correcta sin esfuerzo">5 · Fácil</button>
      </div>
    </section>

    <details id="templates-section">
      <summary>Plantillas</summary>
      <div class="row">
        <label for="template-select">Plantilla</label>
        <select id="template-select" aria-label="Seleccionar plantilla"><option value="">Elige una plantilla</option></select>
        <button id="load-templates-btn" type="button">Actualizar plantillas</button>
      </div>
      <p id="templates-status" class="status" role="status" aria-live="polite"></p>
      <div id="template-detail" hidden class="item">
        <strong id="tpl-title"></strong> <span id="tpl-meta" class="meta"></span>
        <div id="tpl-front" class="box"></div>
        <div id="tpl-back" class="box"></div>
        <div id="tpl-followups-wrap" hidden><strong class="meta">Preguntas de seguimiento</strong><ul id="tpl-followups"></ul></div>
        <p id="tpl-explanation" class="meta" hidden></p>
        <button id="create-from-template-btn" type="button">Crear tarjeta en el mazo seleccionado</button>
      </div>
    </details>

    <details id="errors-section">
      <summary>Registro de errores</summary>
      <form id="error-form" class="field">
        <label for="err-attempted">Texto original</label>
        <textarea id="err-attempted" required placeholder="Escribe el texto que quieres mejorar"></textarea>
        <label for="err-corrected">Texto corregido</label>
        <textarea id="err-corrected" required placeholder="Escribe la corrección"></textarea>
        <label for="err-rationale">Motivo</label>
        <textarea id="err-rationale" required placeholder="Explica el motivo del cambio"></textarea>
        <div class="row"><button type="submit">Guardar borrador</button></div>
      </form>
      <div class="row">
        <label for="error-filter">Estado</label>
        <select id="error-filter" aria-label="Filtrar errores por estado">
          <option value="draft">Borradores</option><option value="">Todos</option>
          <option value="approved">Aprobados</option><option value="discarded">Descartados</option>
        </select>
        <button id="load-errors-btn" type="button">Actualizar errores</button>
      </div>
      <p id="errors-status" class="status" role="status" aria-live="polite"></p>
      <div id="errors-list"></div>
    </details>
  </main>

  <script src="/static/study.js" defer></script>
</body>
</html>
