<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechCards · Propuestas de diseño</title>
<style>
  :root { color-scheme: dark; --bg:#0b0c10; --fg:#ecedf0; --muted:#8b8f9a; --line:#23252c; --accent:#7c5cff; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; background:var(--bg); color:var(--fg);
    font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display:grid; place-items:center; padding: max(24px, env(safe-area-inset-top)) 20px 24px; }
  main { width:min(880px,100%); }
  h1 { font-size: clamp(28px, 5vw, 44px); letter-spacing:-0.03em; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 32px; }
  ul { list-style:none; padding:0; margin:0; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  a { display:block; padding:24px; border:1px solid var(--line); border-radius:16px; color:inherit; text-decoration:none;
    background:linear-gradient(180deg,#14161c,#0f1015); transition: border-color .15s ease, transform .15s ease; }
  a:hover { border-color: var(--accent); }
  a:active { transform: scale(.98); }
  strong { display:block; font-size:20px; letter-spacing:-0.02em; margin-bottom:4px; }
  span { color:var(--muted); font-size:14px; }
  @media (prefers-reduced-motion: reduce) { a { transition:none; } }
</style>
</head>
<body>
<main>
  <h1>Propuestas de diseño</h1>
  <p>Tres direcciones para la UI de estudio de TechCards SRS. Todas usan la API real.</p>
  <ul>
    <li><a href="/propuesta1/"><strong>Propuesta 1</strong><span>Neon · dirección libre</span></a></li>
    <li><a href="/propuesta2/"><strong>Propuesta 2</strong><span>Codex · dirección libre</span></a></li>
    <li><a href="/propuesta3/"><strong>Propuesta 3</strong><span>Organizador · cabina de entrenamiento para entrevistas remotas</span></a></li>
  </ul>
</main>
</body>
</html>
