services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-techcards}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-techcards}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build:
      context: .
      target: runtime
    environment: &app_environment
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-techcards}:${POSTGRES_PASSWORD:-local-development-only}@db:5432/${POSTGRES_DB:-techcards}
      GENERATOR_PROVIDER: ${GENERATOR_PROVIDER:-mock}
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  api:
    build:
      context: .
      target: runtime
    environment:
      <<: *app_environment
      GENERATOR_API_KEY: ${GENERATOR_API_KEY:-}
      GENERATOR_MODEL: ${GENERATOR_MODEL:-}
      GENERATOR_BASE_URL: ${GENERATOR_BASE_URL:-https://api.openai.com/v1}
      GENERATOR_TIMEOUT_SECONDS: ${GENERATOR_TIMEOUT_SECONDS:-30}
      GENERATOR_MAX_INPUT_CHARS: ${GENERATOR_MAX_INPUT_CHARS:-8000}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  tests:
    profiles: ["test"]
    build:
      context: .
      target: test
    environment:
      DATABASE_URL: sqlite://
    command: ["pytest", "-q"]
volumes:
  postgres_data:
