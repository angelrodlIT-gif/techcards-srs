name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: techcards
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: techcards_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U techcards -d techcards_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://techcards:ci-only-password@localhost:5432/techcards_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: SQLite tests
        run: uv run pytest -q
      - name: PostgreSQL migration upgrade, schema drift check and downgrade
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: PostgreSQL API tests (disposable database)
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: uv run pytest -q
      - name: Validate Compose and build runtime image
        run: |
          docker compose config --quiet
          docker build --target runtime -t techcards-srs:ci .
